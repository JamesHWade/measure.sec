name: Code quality

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Air
        id: setup-air
        uses: posit-dev/setup-air@v1
        with:
          version: "0.12.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Jarl
        run: python -m pip install --disable-pip-version-check --no-input "jarl-linter==0.7.1"

      - name: Verify tool versions
        env:
          AIR_VERSION: ${{ steps.setup-air.outputs.air-version }}
        run: |
          air --version
          jarl --version
          test "$AIR_VERSION" = "0.12.0"
          test "$(air --version)" = "air 0.12.0"
          test "$(jarl --version)" = "jarl 0.7.1"

      - name: Check Air formatting
        run: air format . --check

      - name: Check Jarl lint
        run: jarl check .
