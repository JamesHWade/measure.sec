on:
  push:
    branches: [main, master]
  pull_request:

name: SEC elution qualification

permissions:
  contents: read

jobs:
  sec-elution-qualification:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: |
            any::jsonlite
            any::digest

      - name: Install the checked-out SEC candidate
        run: R CMD INSTALL .

      - name: Qualify installed units, alignment and downstream calculation
        run: |
          python3 --version
          Rscript tools/sec-elution/qualify.R "$RUNNER_TEMP/sec-elution"
          python3 tools/sec-elution/verify.py "$RUNNER_TEMP/sec-elution"

      - name: Qualify copied tools and output paths containing spaces
        run: |
          mkdir "$RUNNER_TEMP/qualification tools"
          cp -R tools/sec-elution "$RUNNER_TEMP/qualification tools/sec-elution"
          Rscript "$RUNNER_TEMP/qualification tools/sec-elution/qualify.R" "$RUNNER_TEMP/sec elution copied"
          python3 "$RUNNER_TEMP/qualification tools/sec-elution/verify.py" "$RUNNER_TEMP/sec elution copied"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-elution-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sec-elution
            ${{ runner.temp }}/sec elution copied
          if-no-files-found: ignore
